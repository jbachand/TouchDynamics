name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ios:
    name: Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          phones = [d for r, ds in runtimes.items() if 'iOS' in r for d in ds if d['name'].startswith('iPhone')]
          print(phones[-1]['udid'] if phones else '')")
          test -n "$UDID" || { echo 'no iPhone simulator available'; xcrun simctl list devices available; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"
      - name: Build and test
        run: |
          set -o pipefail
          if command -v xcbeautify >/dev/null; then
            xcodebuild test -scheme TouchDynamics \
              -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath .derived | xcbeautify --renderer github-actions
          else
            xcodebuild test -scheme TouchDynamics \
              -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath .derived
          fi
      - name: Swift 6 language mode check
        run: |
          xcodebuild build \
            -scheme TouchDynamics \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived-swift6 \
            OTHER_SWIFT_FLAGS='-swift-version 6'

  build-core-macos:
    name: Build platform-neutral core (macOS host)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build

  build-example:
    name: Build example app and run UI tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          phones = [d for r, ds in runtimes.items() if 'iOS' in r for d in ds if d['name'].startswith('iPhone')]
          print(phones[-1]['udid'] if phones else '')")
          test -n "$UDID" || { echo 'no iPhone simulator available'; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          xcodebuild build \
            -project Example/TouchDynamicsExample.xcodeproj \
            -scheme TouchDynamicsExample \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath Example/.derived \
            CODE_SIGNING_ALLOWED=NO
      - name: UI tests (real touches through the observer)
        run: |
          set -o pipefail
          if command -v xcbeautify >/dev/null; then
            xcodebuild test \
              -project Example/TouchDynamicsExample.xcodeproj \
              -scheme TouchDynamicsExample \
              -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath Example/.derived \
              -only-testing:TouchDynamicsExampleUITests | xcbeautify --renderer github-actions
          else
            xcodebuild test \
              -project Example/TouchDynamicsExample.xcodeproj \
              -scheme TouchDynamicsExample \
              -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
              -derivedDataPath Example/.derived \
              -only-testing:TouchDynamicsExampleUITests
          fi
