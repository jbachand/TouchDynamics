name: TouchDynamicsExample
options:
  bundleIdPrefix: com.n2op
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  TouchDynamics:
    path: ..
targets:
  TouchDynamicsExample:
    type: application
    platform: iOS
    sources:
      - path: TouchDynamicsExample
    dependencies:
      - package: TouchDynamics
    info:
      path: TouchDynamicsExample/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: TouchDynamics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.n2op.TouchDynamicsExample
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
  TouchDynamicsExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TouchDynamicsExampleUITests
    dependencies:
      - target: TouchDynamicsExample
    info:
      path: TouchDynamicsExampleUITests/Info.plist
    settings:
      base:
        TEST_TARGET_NAME: TouchDynamicsExample
        PRODUCT_BUNDLE_IDENTIFIER: com.n2op.TouchDynamicsExampleUITests
        SWIFT_VERSION: "5.9"
schemes:
  TouchDynamicsExample:
    build:
      targets:
        TouchDynamicsExample: all
        TouchDynamicsExampleUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TouchDynamicsExampleUITests
